name: Flask CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t flask-cicd-demo:latest .

      - name: Publish image to Docker Hub (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag flask-cicd-demo:latest "$DOCKERHUB_USERNAME/flask-cicd-demo:latest"
            docker push "$DOCKERHUB_USERNAME/flask-cicd-demo:latest"
          else
            echo "Docker Hub credentials not configured. Skipping publishing."
          fi

      - name: Deploy to Render (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered."
          else
            echo "Render deploy hook not configured. Skipping deployment."
          fi

      - name: Pipeline completed
        run: echo "CI/CD pipeline completed successfully!"
